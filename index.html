<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>名古屋旅遊 2026</title>
<meta name="description" content="10/14–10/21 八天七夜｜每日行程、預約編號、餐廳與購物清單">
<meta property="og:title" content="名古屋旅遊 2026">
<meta property="og:description" content="10/14–10/21 八天七夜｜每日行程、預約編號、餐廳與購物清單">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.js"></script>
<style>
:root{
  --paper:#F6F7F4; --card:#FFFFFF; --ink:#22262E; --muted:#636B78; --line:#DDE1E6;
  --indigo:#2C4A6E; --indigo-soft:#E4EBF3; --momiji:#B8352B; --momiji-soft:#F7E4E1;
  --ginkgo:#C98F0A; --ginkgo-soft:#FBF0D6; --moss:#3E7D55; --moss-soft:#E3F0E7;
  --chip:#ECEFF2; --nav-bg:rgba(246,247,244,.92);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A24; --card:#1A2330; --ink:#E7EAEE; --muted:#9AA4B2; --line:#2B3646;
    --indigo:#93B4DC; --indigo-soft:#1F2D40; --momiji:#E7766A; --momiji-soft:#3A2224;
    --ginkgo:#E9BC4F; --ginkgo-soft:#3A311B; --moss:#79BD8F; --moss-soft:#1D3326;
    --chip:#222D3B; --nav-bg:rgba(19,26,36,.92); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A24; --card:#1A2330; --ink:#E7EAEE; --muted:#9AA4B2; --line:#2B3646;
  --indigo:#93B4DC; --indigo-soft:#1F2D40; --momiji:#E7766A; --momiji-soft:#3A2224;
  --ginkgo:#E9BC4F; --ginkgo-soft:#3A311B; --moss:#79BD8F; --moss-soft:#1D3326;
  --chip:#222D3B; --nav-bg:rgba(19,26,36,.92); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  font-size:16px;line-height:1.72;}
.num{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--indigo);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ginkgo);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* top + hero */
.top{padding-top:18px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{margin:0;font-size:21px;letter-spacing:.04em}
.brand .range{color:var(--muted);font-size:17px;font-weight:600}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:22px 0 18px}
.stamp{width:116px;height:116px;border-radius:50%;color:var(--momiji);
  border:3px solid var(--momiji);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5.5px var(--momiji);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);
  animation:thunk .55s cubic-bezier(.2,1.4,.4,1) .1s both}
.stamp .s-top{font-size:12px;letter-spacing:.25em;margin-bottom:2px}
.stamp .s-date{font-size:40px;font-weight:700;line-height:1}
.stamp .s-bot{font-size:12px;margin-top:4px;letter-spacing:.1em}
@keyframes thunk{from{transform:rotate(-8deg) scale(1.35);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}
.hero h2{margin:0 0 2px;font-size:22px;line-height:1.35}
.hero p{margin:0 0 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 16px;
  background:var(--indigo);color:var(--paper);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav-bg);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .rail{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;max-width:720px;margin:0 auto;scrollbar-width:none}
.nav .rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);border-radius:12px;padding:6px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;min-width:54px;position:relative}
.chip .c1{font-size:14px;font-weight:600}
.chip .c2{font-size:13px;color:var(--muted)}
.chip[aria-current="true"]{background:var(--indigo);color:var(--paper)}
.chip[aria-current="true"] .c2{color:inherit;opacity:.8}
.chip.today::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ginkgo)}

/* section */
main{padding:6px 0 40px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 0 6px}
.dhead{display:flex;align-items:flex-end;gap:10px}
.dnum{font-size:46px;font-weight:700;line-height:.95;color:var(--indigo)}
.dmeta{display:flex;flex-direction:column;font-size:13px;color:var(--muted);line-height:1.35;padding-bottom:3px}
.stitle{margin:6px 0 0;font-size:22px;line-height:1.4}

/* markdown */
.md{overflow-wrap:anywhere}
.md p{margin:8px 0}
.md h2{font-size:19px;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.md h3{font-size:17px;margin:22px 0 8px}
.md ul{padding-left:20px;margin:6px 0}
.md li{margin:3px 0}
.md li.task{list-style:none;margin-left:-20px}
.md input[type=checkbox]{width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--momiji);cursor:pointer}
.md code{font-family:"Barlow Condensed","Arial Narrow",monospace;font-size:1.08em;font-weight:600;letter-spacing:.03em;
  background:var(--indigo-soft);color:var(--indigo);padding:1px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tw{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
.md th,.md td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;text-align:left;vertical-align:top}
.md th{color:var(--muted);font-weight:600;font-size:13px}
.md td:first-child{white-space:nowrap}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.maplink{display:inline-block;font-size:13px;text-decoration:none;background:var(--chip);color:var(--ink);
  border-radius:999px;padding:0 9px;margin-left:2px;white-space:nowrap}
.imglink{display:block;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;text-decoration:none}

.box{padding:11px 14px;border-left:4px solid;border-radius:0 12px 12px 0;margin:14px 0}
.box>:first-child{margin-top:0}.box>:last-child{margin-bottom:0}
.box.info{border-color:var(--indigo);background:var(--indigo-soft)}
.box.warning{border-color:var(--ginkgo);background:var(--ginkgo-soft)}
.box.danger{border-color:var(--momiji);background:var(--momiji-soft)}
.box.success{border-color:var(--moss);background:var(--moss-soft)}
details{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:var(--card)}
summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted);flex:0 0 auto}
details[open]>summary::after{content:"－"}
details[open]>summary{border-bottom:1px solid var(--line)}
.dbody{padding:4px 14px 12px}

/* day timeline */
.day .md>ul{list-style:none;padding-left:0;position:relative;margin:14px 0}
.day .md>ul::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:var(--line)}
.day .md>ul>li{position:relative;padding-left:26px;margin:0 0 16px}
.day .md>ul>li::before{content:"";position:absolute;left:1px;top:.5em;width:12px;height:12px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--indigo)}
.day .md>ul>li>strong:first-child,.day .md>ul>li>p>strong:first-child{font-family:"Barlow Condensed","Arial Narrow",sans-serif;
  font-size:18px;color:var(--indigo);margin-right:2px}
.day .md>ul>li>ul{font-size:15px;color:var(--ink);margin-top:2px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:28px}

footer{color:var(--muted);font-size:13px;padding:10px 0 34px;border-top:1px solid var(--line)}
footer p{margin:6px 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;
  max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.loading{color:var(--muted);padding:40px 0}
footer .btn{text-decoration:none}
@media print{.nav,.pn,.toast,.hero .btn{display:none!important}details{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var SRC = 'content.md';
var WD = '日一二三四五六';
var DATA = null, current = null, lastMod = null;

function safe(fn, fb){ try { return fn(); } catch (e) { return fb; } }
var store = { get: function(k){ return safe(function(){ return localStorage.getItem(k); }, null); },
              set: function(k,v){ safe(function(){ localStorage.setItem(k,v); }); } };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(sel, root){ return (root || document).querySelector(sel); }

/* ---------- content.md ---------- */
function parseContent(text){
  text = text.replace(/\r/g, '').replace(/<!--[\s\S]*?-->/g, '');
  var meta = {}, secs = [], cur = null, oi = 0;
  text.split('\n').forEach(function(l){
    var h = l.match(/^#\s+(.+?)\s*$/);
    if (h) {
      var t = h[1], dm = t.match(/^(\d{4}-\d{1,2}-\d{1,2})\s*(.*)$/);
      if (dm) {
        var p = dm[1].split('-'), date = p[0] + '-' + ('0' + p[1]).slice(-2) + '-' + ('0' + p[2]).slice(-2);
        cur = { id: 'd' + date, date: date, title: dm[2] || '', lines: [] };
      } else {
        var parts = t.split(/\s*[|｜]\s*/);
        cur = { id: 's' + (oi++), tab: parts[0], title: parts[1] || parts[0], lines: [] };
      }
      secs.push(cur); return;
    }
    if (!cur) { var km = l.match(/^\s*([A-Za-z]+)\s*[:：]\s*(\S.*)$/); if (km) meta[km[1].toLowerCase()] = km[2].trim(); return; }
    cur.lines.push(l);
  });
  secs.forEach(function(s){ s.md = s.lines.join('\n'); delete s.lines; });
  return { title: meta.title || '旅遊行程', edit: meta.edit || '', sections: secs };
}

/* ---------- markdown ---------- */
if (window.marked) {
  marked.use({ gfm: true, breaks: true, renderer: {
    link: function(href, title, text){
      var isMap = String(text).trim() === '地圖';
      return '<a href="' + esc(href) + '" target="_blank" rel="noopener"' + (isMap ? ' class="maplink"' : '') + '>' + (isMap ? '📍 地圖' : text) + '</a>';
    },
    image: function(href, title, text){
      return '<a class="imglink" href="' + esc(href) + '" target="_blank" rel="noopener">🖼️ ' + esc(text || '圖片') + '（點開看圖）</a>';
    }
  }});
}
function mdBlock(s){ return window.marked ? marked.parse(s) : '<p>' + esc(s).replace(/\n/g, '<br>') + '</p>'; }
function mdInline(s){ return window.marked ? marked.parseInline(s) : esc(s); }
var OPEN_RE = /^:::\s*(info|warning|danger|success|spoiler)\b\s*(.*)$/;
function renderMd(src){
  var lines = String(src || '').split('\n'), out = '', buf = [];
  function flush(){ if (buf.length) { out += mdBlock(buf.join('\n')); buf = []; } }
  for (var i = 0; i < lines.length; i++) {
    var m = lines[i].match(OPEN_RE);
    if (m) {
      flush();
      var depth = 1, j = i + 1, inner = [];
      for (; j < lines.length; j++) {
        if (OPEN_RE.test(lines[j])) depth++;
        else if (/^:::\s*$/.test(lines[j])) { depth--; if (depth === 0) break; }
        inner.push(lines[j]);
      }
      var body = renderMd(inner.join('\n'));
      if (m[1] === 'spoiler') out += '<details><summary>' + mdInline(m[2] || '展開') + '</summary><div class="dbody">' + body + '</div></details>';
      else out += '<div class="box ' + m[1] + '">' + body + '</div>';
      i = j; continue;
    }
    if (/^\[TOC\]\s*$/.test(lines[i])) continue;
    buf.push(lines[i]);
  }
  flush();
  return out;
}

/* ---------- dates ---------- */
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseD(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function md_(s){ var d = parseD(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function wd(s){ return WD[parseD(s).getDay()]; }
function days(){ return DATA.sections.filter(function(s){ return s.date; }).sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }
function others(){ return DATA.sections.filter(function(s){ return !s.date; }); }
function ordered(){ var o = others(); return [o[0]].concat(days(), o.slice(1)).filter(Boolean); }
function dayNo(sec){ return days().indexOf(sec) + 1; }
var TODAY = ymd(new Date());
function todaySec(){ return days().filter(function(d){ return d.date === TODAY; })[0] || null; }

/* ---------- rendering ---------- */
function heroHTML(){
  var ds = days(), first = ds[0], last = ds[ds.length - 1], t = todaySec();
  if (!first) return '';
  var stampDate, top, bot, h, p, btn = '';
  if (t) {
    stampDate = md_(t.date); top = '今天'; bot = 'Day ' + dayNo(t) + '・週' + wd(t.date);
    h = '今天是 Day ' + dayNo(t); p = esc(t.title);
    btn = '<button class="btn" data-go="' + t.id + '">打開今天行程</button>';
  } else if (TODAY < first.date) {
    var n = Math.round((parseD(first.date) - parseD(TODAY)) / 86400000);
    stampDate = md_(first.date); top = '出發'; bot = '週' + wd(first.date);
    h = '還有 ' + n + ' 天出發'; p = 'Day 1：' + esc(first.title);
    btn = '<button class="btn" data-go="' + first.id + '">看 Day 1</button>';
  } else {
    stampDate = md_(last.date); top = '平安'; bot = '歸國';
    h = '旅程結束，歡迎回家'; p = '回顧一下這 ' + ds.length + ' 天吧';
  }
  return '<div class="hero"><div class="stamp" aria-hidden="true"><span class="s-top">' + top + '</span><span class="s-date num">' + stampDate +
    '</span><span class="s-bot">' + bot + '</span></div><div><h2>' + h + '</h2><p>' + p + '</p>' + btn + '</div></div>';
}
function chipHTML(sec){
  var t = todaySec(), isDay = !!sec.date;
  var c1 = isDay ? 'Day ' + dayNo(sec) : esc(sec.tab || sec.title);
  var c2 = isDay ? '<span class="c2 num">' + md_(sec.date) + '</span>' : '';
  return '<button class="chip' + (t && t.id === sec.id ? ' today' : '') + '" data-tab="' + sec.id + '"><span class="c1">' + c1 + '</span>' + c2 + '</button>';
}
function sectionHTML(sec){
  var isDay = !!sec.date, head = '';
  if (isDay) head = '<div class="dhead"><div class="dnum num">' + md_(sec.date) + '</div><div class="dmeta"><span>週' + wd(sec.date) + '</span><span>Day ' + dayNo(sec) + '</span></div></div>';
  head += '<h2 class="stitle">' + esc(sec.title) + '</h2>';
  var pn = '';
  if (isDay) {
    var ds = days(), i = ds.indexOf(sec), prev = ds[i - 1], next = ds[i + 1];
    pn = '<div class="pn">' + (prev ? '<button class="btn ghost" data-go="' + prev.id + '">上一天：Day ' + i + '</button>' : '<span></span>') +
      (next ? '<button class="btn ghost" data-go="' + next.id + '">下一天：Day ' + (i + 2) + '</button>' : '') + '</div>';
  }
  return '<section class="sec' + (isDay ? ' day' : '') + '" data-sid="' + sec.id + '"><header class="shead"><div>' + head + '</div></header><div class="md">' + renderMd(sec.md) + '</div>' + pn + '</section>';
}
function fmtTime(d){ if (!d || isNaN(d)) return ''; return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function shell(){
  var ds = days(), range = ds.length ? md_(ds[0].date) + '–' + md_(ds[ds.length - 1].date) : '';
  var upd = lastMod ? fmtTime(new Date(lastMod)) : '';
  $('#app').innerHTML =
    '<div class="wrap top"><div class="brand"><h1>' + esc(DATA.title) + '</h1><span class="range num">' + range + '</span></div>' + heroHTML() + '</div>' +
    '<nav class="nav" aria-label="行程分頁"><div class="rail">' + ordered().map(chipHTML).join('') + '</div></nav>' +
    '<main id="main" class="wrap"></main>' +
    '<div class="wrap"><footer>' + (upd ? '<p>內容更新於：' + upd + '</p>' : '') +
    '<p>勾選的待辦只會記在你自己的手機上。</p>' +
    (DATA.edit ? '<p><a class="btn ghost" href="' + esc(DATA.edit) + '" target="_blank" rel="noopener">✏️ 到 GitHub 修改行程</a></p>' : '') +
    '</footer></div>';
}
function enhance(root, sec){
  root.querySelectorAll('table').forEach(function(t){ var w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
  root.querySelectorAll('code').forEach(function(c){ c.title = '點一下複製'; c.setAttribute('role', 'button'); c.tabIndex = 0; });
  root.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.disabled = false;
    var li = cb.closest('li'); if (li) li.classList.add('task');
    var key = 'chk:' + sec.id + ':' + (li ? li.textContent.trim() : '');
    cb.dataset.key = key;
    var v = store.get(key); if (v !== null) cb.checked = v === '1';
  });
}
function show(id, scroll){
  var sec = DATA.sections.filter(function(s){ return s.id === id; })[0] || ordered()[0];
  current = sec.id; store.set('lastTab', current);
  var main = $('#main');
  main.innerHTML = sectionHTML(sec);
  enhance(main, sec);
  document.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-current', c.dataset.tab === current ? 'true' : 'false'); });
  var chip = $('.chip[data-tab="' + current + '"]'), rail = $('.rail');
  if (chip && rail) rail.scrollLeft = chip.offsetLeft - rail.clientWidth / 2 + chip.offsetWidth / 2;
  if (scroll) {
    var nav = $('.nav'), top = main.getBoundingClientRect().top + window.scrollY - (nav ? nav.offsetHeight : 0);
    if (window.scrollY > top) window.scrollTo(0, top);
  }
}

/* ---------- feedback ---------- */
var toastTimer = null;
function toast(msg){
  var t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 2600);
}
function copyText(txt){
  var done = function(){ toast('已複製：' + txt); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    var ok = safe(function(){ return document.execCommand('copy'); }, false); ta.remove();
    toast(ok ? '已複製：' + txt : '請長按編號複製');
  }
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target;
  var tab = t.closest('[data-tab]'); if (tab) { show(tab.dataset.tab, true); return; }
  var go = t.closest('[data-go]'); if (go) { show(go.dataset.go, true); return; }
  if (t.matches('.md code')) copyText(t.textContent);
});
document.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.md code')) { e.preventDefault(); copyText(e.target.textContent); } });
document.addEventListener('change', function(e){ if (e.target.matches('.md input[type=checkbox]')) store.set(e.target.dataset.key, e.target.checked ? '1' : '0'); });

/* ---------- start ---------- */
function fail(){
  $('#app').innerHTML = '<div class="wrap top"><div class="box danger"><p><strong>讀不到行程內容（content.md）</strong></p>' +
    '<p>請確認 content.md 和 index.html 放在同一個資料夾，並用 GitHub Pages 的網址開啟。直接在電腦上雙擊 index.html 會被瀏覽器擋住，所以看不到內容。</p></div></div>';
}
$('#app').innerHTML = '<div class="wrap top"><p class="loading">載入行程中…</p></div>';
fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' }).then(function(r){
  if (!r.ok) throw new Error('HTTP ' + r.status);
  lastMod = r.headers.get('Last-Modified');
  return r.text();
}).then(function(text){
  DATA = parseContent(text);
  if (!DATA.sections.length) throw new Error('empty');
  document.title = DATA.title;
  shell();
  var t0 = todaySec(), last = store.get('lastTab');
  var valid = function(id){ return id && DATA.sections.some(function(s){ return s.id === id; }); };
  show(t0 ? t0.id : valid(last) ? last : ordered()[0].id, false);
}).catch(fail);
})();
</script>
</body>
